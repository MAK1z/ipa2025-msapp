apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ipa2025-msapp-web-route
  namespace: ipa-2025
spec:
  parentRefs:
    - name: main-gateway
      namespace: default
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ipa2025-msapp-web-service
          port: 80
